name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, linux, ARM64, symsvel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format with repository Prettier
        run: npm run format
      - name: Commit formatting on dev
        if: github.ref_name == 'dev' && github.event_name == 'push'
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'style(app): apply Prettier formatting [skip ci]'
            git fetch origin dev
            if ! git rebase origin/dev; then
              git rebase --abort
              exit 1
            fi
            git push origin HEAD:dev
          fi
      - run: npx playwright install chromium
      - run: npm run qa
      - name: Verify deployable static build
        run: |
          test -f build/index.html
          test -f build/.htaccess
          test -f build/robots.txt
